[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scidata-generation"
version = "0.1.0"
description = "Graph-guided generation and verification of scientific coding problems"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = ["pyarrow>=15", "jsonschema>=4.18"]

[project.optional-dependencies]
validation = ["numpy>=1.24", "scipy>=1.10", "sympy>=1.12"]
deepseek = ["transformers>=4.40"]
dev = ["ruff>=0.9", "build>=1"]

[project.scripts]
scidata-generate = "scidata.pipeline:main"
scidata-export = "scidata.export:main"
scidata-environments = "scidata.environments:main"

[tool.setuptools]
packages = ["scidata", "scidata.catalog", "scidata.resources"]

[tool.setuptools.package-dir]
scidata = "src"
"scidata.resources" = "resources"

[tool.setuptools.package-data]
"scidata.resources" = ["*.json", "*.jsonl"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E9", "F"]
